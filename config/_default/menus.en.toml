[[main]]
name = "{{< icon \"mug-hot\" >}} Bookshelf"
url = "/bookshelf"
weight = 40

[[main]]
name = "{{< icon \"heart\" >}} Sponsor my work"
url = "/sponsor"
weight = 50

[[main]]
name = "{{< icon \"graduation-cap\" >}} CV"
url = "/cv"
weight = 60

# -- Footer Menu --
# The footer menu is displayed at the bottom of the page, just before
# the copyright notice. Configure as per the main menu above.

[[footer]]
  name = "Source Code"
  url = "https://github.com/drupol/not-a-number.io"
  weight = 30

